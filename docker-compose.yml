services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: smart-health-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: smart-health-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: smart-health-kafka-init
    depends_on:
      - kafka
    restart: "no"
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic health-vitals --partitions 3 --replication-factor 1
      "

  cassandra:
    image: cassandra:4.1
    container_name: smart-health-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SmartHealthCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cassandra-schema.cql:/schema/cassandra-schema.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    container_name: smart-health-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-schema-init.cql:/schema/cassandra-schema-init.cql:ro
      - ./docker/cassandra-init.sh:/schema/cassandra-init.sh:ro
    environment:
      CASSANDRA_HOST: cassandra
    restart: "no"
    entrypoint: ["/bin/bash", "/schema/cassandra-init.sh"]

  vue-api:
    build:
      context: .
      dockerfile: Vue.Api/Dockerfile
    container_name: smart-health-vue-api
    ports:
      - "5099:5099"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:5099
      Cassandra__ContactPoint: cassandra
      DataGeneration__Enabled: "false"
      Firebase__Enabled: "true"
      Firebase__ProjectId: fiek-240db
      Firebase__ServiceAccountPath: firebase-service-account.json
    volumes:
      - ./Vue.Api/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    restart: unless-stopped

  vue-client:
    build:
      context: .
      dockerfile: vue-client/Dockerfile
    container_name: smart-health-vue-client
    ports:
      - "5173:80"
    depends_on:
      vue-api:
        condition: service_started
    restart: unless-stopped

  streaming:
    build:
      context: .
      dockerfile: Streaming.App/Dockerfile
    container_name: smart-health-streaming
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: health-vitals
      Cassandra__ContactPoint: cassandra
      Cassandra__Port: "9042"
      Cassandra__Keyspace: smart_health
      SignalR__HubUrl: http://vue-api:5099/healthHub
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      vue-api:
        condition: service_started
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Simulator.App/Dockerfile
    container_name: smart-health-simulator
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: health-vitals
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      streaming:
        condition: service_started
    restart: unless-stopped

volumes:
  cassandra-data:
